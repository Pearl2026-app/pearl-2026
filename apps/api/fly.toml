# Fly.io: the background worker only (queues and timers), in Mumbai (bom).
# The API itself runs on Vercel (the `api` service in the root vercel.json) with RUN_WORKERS=false.
# Same image as the API, built from the repository root:
#   fly deploy --config apps/api/fly.toml .
# Secrets (DATABASE_URL, REDIS_URL, JWT_*, APP_SECRET, RAZORPAY_*, S3_* …) are set with `fly secrets set`, never here.
# Migrations are applied by the "Database migrations" GitHub workflow, not by this app.
app = "sahyadri-pearls-worker"
primary_region = "bom"

[build]
  dockerfile = "../../Dockerfile.vercel"

[deploy]
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  QUEUE_MODE = "redis"
  STORAGE_DRIVER = "s3"
  S3_REGION = "ap-south-1"

[processes]
  worker = "node --enable-source-maps dist/worker.js"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
