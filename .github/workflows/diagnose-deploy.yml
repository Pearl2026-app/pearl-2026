# One-off diagnosis (run by hand): replays the demo deployment's startup against a database that already has the
# last good deployment's migrations, then boots the API in demo mode and checks /health.
name: Diagnose demo deploy
on:
  workflow_dispatch:
    inputs:
      good:
        description: Last commit that deployed
        default: edb1b97
      bad:
        description: Commit that fails to deploy
        default: main

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: demo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/demo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay
        shell: bash
        run: |
          note() { local t="$1"; shift; local body; body=$(tail -c 3500 "$@" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'); echo "::notice title=$t::$body"; }
          set +e
          git checkout -q ${{ inputs.good }}
          pnpm install --frozen-lockfile --filter "@sahyadri/db..." > /tmp/1.log 2>&1 || { note "install good" /tmp/1.log; exit 1; }
          (cd packages/db && npx prisma migrate deploy) > /tmp/2.log 2>&1 || { note "migrate good" /tmp/2.log; exit 1; }
          (cd packages/db && SEED_PASSWORD=Sahyadri@2026 STORAGE_LOCAL_DIR=/tmp/uploads npx tsx seed/seed.ts) > /tmp/3.log 2>&1 || { note "seed good" /tmp/3.log; exit 1; }
          note "good ok" /tmp/2.log
          git checkout -q ${{ inputs.bad }}
          pnpm install --frozen-lockfile --filter "@sahyadri/api..." > /tmp/4.log 2>&1 || { note "install bad" /tmp/4.log; exit 1; }
          (cd packages/db && npx prisma migrate deploy) > /tmp/5.log 2>&1; r=$?; note "migrate bad (exit $r)" /tmp/5.log; [ $r = 0 ] || exit 1
          (cd packages/db && SEED_PASSWORD=Sahyadri@2026 STORAGE_LOCAL_DIR=/tmp/uploads npx tsx seed/seed.ts) > /tmp/6.log 2>&1; note "seed bad (exit $?)" /tmp/6.log
          pnpm --filter "@sahyadri/api..." build > /tmp/7.log 2>&1 || { note "build bad" /tmp/7.log; exit 1; }
          cd apps/api
          DEMO_MODE=true NODE_ENV=production PORT=4000 STORAGE_LOCAL_DIR=/tmp/uploads JWT_ACCESS_SECRET=x-access-secret-for-diagnosis-only-1234567890 JWT_REFRESH_SECRET=x-refresh-secret-for-diagnosis-only-1234567890 \
            node dist/main.js > /tmp/api.log 2>&1 &
          ok=0; for i in $(seq 1 60); do curl -sf localhost:4000/api/v1/health > /tmp/h.txt && { ok=1; break; }; sleep 2; done
          note "api boot (ok=$ok)" /tmp/api.log
          [ $ok = 1 ] && note "health" /tmp/h.txt
          [ $ok = 1 ]
